{% extends "base.html" %}
{% block title %}Log in · AI TravelMate{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-5">
  <h1 class="h3 text-navy mb-3">Log in</h1>
  <form method="post" class="card border-0 shadow-sm rounded-4 p-4">
    {% csrf_token %}
    {% if form.errors %}<div class="alert alert-danger">Incorrect username or password.</div>{% endif %}
    <div class="mb-3"><label class="form-label" for="id_username">Username</label>
      <input type="text" name="username" id="id_username" class="form-control" autofocus required></div>
    <div class="mb-3"><label class="form-label" for="id_password">Password</label>
      <input type="password" name="password" id="id_password" class="form-control" required></div>
    <input type="hidden" name="next" value="{{ next }}">
    <button class="btn btn-teal text-white" type="submit">Log in</button>
    <div class="small mt-3"><a href="{% url 'password_reset' %}">Forgot password?</a> ·
      <a href="{% url 'signup' %}">Create an account</a></div>
  </form>
</div></div>
{% endblock %}
